  <div class="portfolio-hero">

      {{projectCount}} projects across ticketing, real estate, pharma, government, fintech, and more. Full-stack development, QA automation, data platforms, and chatbots.

    <button class="filter-btn" data-filter="angular">Angular</button>
    <button class="filter-btn" data-filter="node">Node.js</button>
    <button class="filter-btn" data-filter="python">Python</button>
    <button class="filter-btn" data-filter="wordpress">WordPress</button>
  </div>

  <div class="projects-grid" id="all-projects-grid">
{{grid}}
  </div>
